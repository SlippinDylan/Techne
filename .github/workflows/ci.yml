name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight-check:
    name: Lightweight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_macos: ${{ steps.changes.outputs.run_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-change-classifier.mjs

      - name: Validate automation
        run: |
          bash -n Scripts/create-dmg.sh
          Scripts/create-dmg.sh --help >/dev/null
          node .github/scripts/release-manifest.mjs validate
          node .github/scripts/sync-version.mjs --check
          node .github/scripts/validate-localizations.mjs
          node --test .github/scripts/*.test.mjs

  macos-check:
    name: Test and build Techne
    needs: lightweight-check
    if: needs.lightweight-check.outputs.run_macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Report toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Test Techne
        run: |
          set -o pipefail
          xcodebuild test \
            -project Techne.xcodeproj \
            -scheme Techne \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData-Tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned arm64 app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Techne.xcodeproj \
            -scheme Techne \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify artifact contract
        run: |
          app='build/DerivedData-Release/Build/Products/Release/Techne.app'
          binary="$app/Contents/MacOS/Techne"
          test -x "$binary"
          test "$(lipo -archs "$binary")" = 'arm64'
          test "$(vtool -show-build "$binary" | grep -c 'minos 26.0')" -eq 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '26.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" = 'https://slippindylan.github.io/homebrew-tap/techne/appcast.xml'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")" = 'TLw+HvAZdTlZUmR3IRYPf+GNOZ1F5yH1repc6UCkrEA='
          test "$(/usr/libexec/PlistBuddy -c 'Print :TechneUpdaterEnabled' "$app/Contents/Info.plist")" = 'YES'
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          for language in en zh-Hans zh-Hant; do
            test -s "$app/Contents/Resources/$language.lproj/Localizable.strings"
            test -s "$app/Contents/Resources/$language.lproj/InfoPlist.strings"
          done

  build-check:
    name: Build Check
    needs:
      - lightweight-check
      - macos-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify CI result
        env:
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight-check.result }}
          MACOS_RESULT: ${{ needs.macos-check.result }}
        run: |
          test "$LIGHTWEIGHT_RESULT" = 'success'
          [[ "$MACOS_RESULT" == 'success' || "$MACOS_RESULT" == 'skipped' ]]
