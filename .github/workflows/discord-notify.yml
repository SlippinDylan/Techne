name: Discord Activity Notifications

on: # zizmor: ignore[dangerous-triggers] Every privileged event executes only the pinned default-branch script.
  push:
    branches:
      - '**'
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
      - review_requested
  issues:
    types:
      - opened
      - reopened
      - closed
      - assigned
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  workflow_run:
    workflows:
      - CI
      - Release
    types:
      - requested
      - completed
  release:
    types:
      - published
  repository_dispatch:
    types:
      - release_started
      - release_published

permissions:
  contents: read

jobs:
  notify:
    name: Send notification
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout trusted notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target must never execute files from a contributor's fork.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Send Discord notification
        if: >-
          github.event_name != 'pull_request_review' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/discord-notify.mjs
